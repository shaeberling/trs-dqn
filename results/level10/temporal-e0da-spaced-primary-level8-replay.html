    ctx.drawImage(atlas, (c % 16) * 8, Math.floor(c / 16) * 26, 8, 26,
                  (i % 64) * 8, Math.floor(i / 64) * 26, 8, 26);
  }
  seek.value = current;
  document.querySelector('#position').textContent = `${(current * metadata.tstates / 1774080).toFixed(1)} s`;
  document.querySelector('#action').textContent = current < actions.length ? `Model action: ${names[actions[current]]}` : 'Game over';
}
play.onclick = () => { playing = !playing; play.textContent = playing ? 'Pause' : 'Play'; };
document.querySelector('#restart').onclick = () => { current = 0; accumulator = 0; playing = true; play.textContent = 'Pause'; draw(); };
seek.oninput = () => { current = Number(seek.value); accumulator = 0; draw(); };
function tick(now) {
  if (last && playing) {
    accumulator += Math.min(now - last, 200) * Number(document.querySelector('#speed').value);
    const duration = metadata.tstates / 1774.08;
    let changed = false;
    while (accumulator >= duration && current < frames.length - 1) { current++; accumulator -= duration; changed = true; }
    if (changed) draw();
    if (current === frames.length - 1) { playing = false; play.textContent = 'Play'; }
  }
  last = now; requestAnimationFrame(tick);
}
atlas.onload = () => { draw(); requestAnimationFrame(tick); };
</script>
</html>
